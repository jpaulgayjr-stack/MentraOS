# AD Glass: build the phone app on GitHub's free hosted runners and prove, as
# far as a machine without Bluetooth can, that it works with Mentra out of the
# picture (docs/ad-glass/spec-phase2.md).
#
#   tests      unit tests and the fork's static guards (Linux)
#   simulator  unsigned Release build for the iOS Simulator, with guards on the
#              built app (identity, telemetry, no backend, URL scheme)
#   boot       the built app booted in a simulator with every Mentra hostname
#              sinkholed: it must reach Home with no sign-in and contact none
#
# No Apple account, no secrets, no Mentra-owned runner. The signed archive and
# TestFlight upload live in a separate workflow that is added once the Apple
# team exists.
#
# Deliberately independent of Mentra's own workflows: those need their
# self-hosted Mac, their match-certs repo and their Doppler / R2 secrets.
name: AD Glass iOS simulator build

on:
  push:
    branches:
      - "ad-glass/**"
    paths:
      - "mobile/**"
      - "cloud-v2/packages/cloud-client/**"
      - "cloud-v2/packages/protocol/**"
      - "cloud-v2/packages/workspace-contract/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ad-glass-ios-simulator.yml"
  workflow_dispatch:
    inputs:
      app_run_id:
        description: "Boot the app built by this earlier run of the workflow instead of building again (run id)"
        required: false
        default: ""

concurrency:
  group: ad-glass-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  tests:
    name: Unit tests and static guards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fork guards (config, hostnames, ring fix, SDK update check)
        run: |
          node --test mobile/scripts/ad-glass.test.mjs mobile/scripts/ad-glass-hosts.test.mjs
          python3 -m py_compile mobile/scripts/ad-glass-sim/sinkhole.py mobile/scripts/ad-glass-sim/pick-simulator.py mobile/scripts/ad-glass-sim/sinkhole-hosts.py
          bash -n mobile/scripts/ad-glass-sim/boot.sh
          # The R1 ring fix must survive every upstream merge until upstream has
          # it (their PR 4981): connectByName has to re-create the controller.
          grep -B4 'controller?.connectById(name)' mobile/modules/bluetooth-sdk/ios/Source/DeviceManager.swift \
            | grep -q 'initController(pendingWearable)' \
            || { echo "::error::The R1 ring fix is missing from DeviceManager.connectByName"; exit 1; }
          # The Bluetooth SDK's update check posts to Mentra Core at a
          # hard-coded address. It must stay opt-in, and AD Glass never opts in.
          grep -A2 'func start() {' mobile/modules/bluetooth-sdk/ios/Source/internal/BluetoothSdkUpdateCheck.swift \
            | grep -q 'guard Self.isEnabledByHost(bundle) else { return }' \
            || { echo "::error::BluetoothSdkUpdateCheck.start() no longer requires the host's opt-in"; exit 1; }
          # The engine builds no cloud client when Core and Runtime are null.
          grep -A6 '^function construct(): void {' mobile/modules/engine/src/services/CloudClientService.ts \
            | grep -q 'if (isCloudlessConfig(getConfigValues())) return' \
            || { echo "::error::CloudClientService.construct() no longer stops for a deployment with no servers"; exit 1; }

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: |
          # mobile's preinstall script is run with zx before node_modules exists.
          bun add -g zx
          bun install --no-frozen-lockfile

      - name: Type check
        working-directory: mobile
        run: bun run compile

      - name: Engine tests (no cloud, speech routing)
        working-directory: mobile/modules/engine
        run: |
          # Each file in its own process, as the engine's own test script does.
          for file in \
            src/services/__tests__/cloudless.test.ts \
            src/services/__tests__/CloudClientService.cloudless.test.ts \
            src/services/__tests__/CloudClientService.coreSession.test.ts \
            src/services/__tests__/cloudEndpointPolicy.test.ts \
            src/services/__tests__/TranscriptionRouting.test.ts \
            src/services/__tests__/TranscriptionSubscriptions.test.ts \
            src/services/__tests__/LocalMiniappRuntime.transcription.test.ts \
            src/services/__tests__/LocalMiniappRuntime.finishTranscription.test.ts
          do
            bun test "$file"
          done

      - name: App tests (jest)
        working-directory: mobile
        run: bun run test

  simulator:
    name: Unsigned simulator build
    # Skipped when an earlier run's build is being booted again.
    if: ${{ !inputs.app_run_id }}
    runs-on: macos-15
    timeout-minutes: 150
    env:
      # Mentra's Sentry build phase would try to upload symbols to their org.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      # Homebrew is not used; keep it from auto-updating if a tool calls it.
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          echo "BUILD_LOG=$RUNNER_TEMP/xcodebuild.log" >> "$GITHUB_ENV"
          ls -d /Applications/Xcode*.app
          # Mentra builds with Xcode 26.2. Prefer it, then the newest 26.x on
          # the image, then whatever the image defaults to.
          pick=""
          if [ -d /Applications/Xcode_26.2.app ]; then
            pick=/Applications/Xcode_26.2.app
          else
            pick="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)"
          fi
          if [ -n "$pick" ]; then sudo xcode-select -s "$pick/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i simulator || true
          df -h /

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tool versions
        run: |
          bun --version
          node --version
          ruby --version
          pod --version

      - name: Environment file
        working-directory: mobile
        env:
          # AD Glass has no backend. These are canaries, not servers: if any
          # code still read the build environment for a cloud address, the
          # canary would be compiled into the app, and "Verify the built app"
          # fails on finding one.
          CLOUD_CORE: https://adglass-canary-core.invalid
          CLOUD_RUNTIME: https://adglass-canary-runtime.invalid
          CLOUD_MINIAPPS: https://adglass-canary-miniapps.invalid/
          CLOUD_DIRECTORY: https://adglass-canary-directory.invalid/
        run: |
          # .env.example carries only public placeholders (a dummy Mapbox token,
          # an empty Sentry DSN). Nothing secret is needed to compile.
          cp .env.example .env
          sed -e "s|^EXPO_PUBLIC_BUILD_ENV=.*|EXPO_PUBLIC_BUILD_ENV=prod|" \
              -e "s|^EXPO_PUBLIC_CLOUD_CORE_URL=.*|EXPO_PUBLIC_CLOUD_CORE_URL=$CLOUD_CORE|" \
              -e "s|^EXPO_PUBLIC_CLOUD_RUNTIME_URL=.*|EXPO_PUBLIC_CLOUD_RUNTIME_URL=$CLOUD_RUNTIME|" \
              -e "s|^EXPO_PUBLIC_MINIAPPS_URL=.*|EXPO_PUBLIC_MINIAPPS_URL=$CLOUD_MINIAPPS|" \
              -e "s|^EXPO_PUBLIC_DIRECTORY_URL=.*|EXPO_PUBLIC_DIRECTORY_URL=$CLOUD_DIRECTORY|" \
              .env > .env.tmp && mv .env.tmp .env
          # No crash reporting to anyone: the DSN must stay empty.
          grep -q '^EXPO_PUBLIC_SENTRY_DSN=$' .env
          grep -q "^EXPO_PUBLIC_CLOUD_CORE_URL=$CLOUD_CORE\$" .env
          grep -q "^EXPO_PUBLIC_CLOUD_RUNTIME_URL=$CLOUD_RUNTIME\$" .env
          # Xcode script phases (the JS bundler) inherit this job's environment.
          grep -E '^EXPO_PUBLIC_[A-Z0-9_]+=' .env >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: |
          # mobile's preinstall script is run with zx before node_modules exists.
          bun add -g zx
          bun install --no-frozen-lockfile

      - name: Expo prebuild (generate the Xcode project)
        working-directory: mobile
        run: |
          rm -rf ios
          bun expo prebuild --platform ios

      - name: Sherpa on-device speech framework
        working-directory: mobile
        run: |
          chmod +x scripts/setup-sherpa-onnx-optional.sh
          ./scripts/setup-sherpa-onnx-optional.sh

      - name: CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build for the iOS Simulator (unsigned)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Mentra.xcworkspace \
            -scheme Mentra \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$BUILD_LOG" \
            | grep --line-buffered -E "error:|fatal error|BUILD SUCCEEDED|BUILD FAILED|\*\* |^note: Run script|Resolved source packages|^CompileSwiftSources|^Ld .*Mentra\.app" || true
          # grep's exit status is not the build's: read the verdict from the log.
          grep -q "BUILD SUCCEEDED" "$BUILD_LOG"

      - name: Verify the built app
        working-directory: mobile/ios
        run: |
          app="build-sim/Build/Products/Release-iphonesimulator/Mentra.app"
          test -d "$app"
          du -sh "$app"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Info.plist"; }
          expect() { # name, actual, wanted
            echo "$1 = $2"
            [ "$2" = "$3" ] || { echo "::error::$1 is '$2', expected '$3'"; exit 1; }
          }
          # Identity: ours, not Mentra's.
          expect CFBundleIdentifier "$(plist CFBundleIdentifier)" "com.domingueandco.adglass"
          expect CFBundleDisplayName "$(plist CFBundleDisplayName)" "AD Glass"
          expect CFBundleName "$(plist CFBundleName)" "AD Glass"
          echo "version $(plist CFBundleShortVersionString) build $(plist CFBundleVersion)"
          # Telemetry: the Bluetooth SDK's PostHog analytics are off, and no
          # Firebase project file ships in the app.
          expect MentraBluetoothSdkAnalyticsDisabled "$(plist MentraBluetoothSdkAnalyticsDisabled)" "true"
          if find "$app" -name 'GoogleService-Info*.plist' | grep -q .; then
            echo "::error::A Firebase GoogleService-Info plist is in the app bundle"; exit 1
          fi
          if plist NSMicrophoneUsageDescription | grep -q "Mentra App"; then
            echo "::error::Permission prompts still name the Mentra App"; exit 1
          fi
          # The Bluetooth SDK's update check to Mentra Core is opt-in. No opt-in.
          if plist MentraBluetoothSdkUpdateCheckEnabled > /dev/null 2>&1; then
            echo "::error::Info.plist sets MentraBluetoothSdkUpdateCheckEnabled"; exit 1
          fi
          # URL scheme: adglass, and nothing of Mentra's.
          schemes="$(plutil -extract CFBundleURLTypes json -o - "$app/Info.plist" \
            | python3 -c 'import json,sys; print(" ".join(s for t in json.load(sys.stdin) for s in t.get("CFBundleURLSchemes", [])))')"
          echo "URL schemes: $schemes"
          echo " $schemes " | grep -q " adglass " || { echo "::error::The adglass URL scheme is not registered"; exit 1; }
          if echo " $schemes " | grep -q -E " com\.mentra(\.[a-z.]+)? "; then
            echo "::error::A Mentra URL scheme is still registered: $schemes"; exit 1
          fi
          # Backend: none. The embedded deployment is the local one, and no cloud
          # address from the build environment (the canaries) is in the
          # JavaScript bundle or in the packaged Expo config.
          test -f "$app/main.jsbundle"
          ls -lh "$app/main.jsbundle"
          grep -a -q -F "ad-glass-local" "$app/main.jsbundle" \
            || { echo "::error::main.jsbundle does not contain the ad-glass-local deployment"; exit 1; }
          for canary in "$EXPO_PUBLIC_CLOUD_CORE_URL" "$EXPO_PUBLIC_CLOUD_RUNTIME_URL" "$EXPO_PUBLIC_MINIAPPS_URL" "$EXPO_PUBLIC_DIRECTORY_URL" "adglass-canary"; do
            test -n "$canary"
            if grep -a -q -F "$canary" "$app/main.jsbundle"; then
              echo "::error::main.jsbundle contains $canary: something still reads a cloud address from the build environment"; exit 1
            fi
          done
          config="$(find "$app" -name app.config | head -1)"
          test -f "$config" || { echo "::error::The packaged Expo config (app.config) was not found in the app"; exit 1; }
          if grep -a -q -F "adglass-canary" "$config" || grep -a -q -i -E "mentraglass\.(com|cn)|mentra\.glass" "$config"; then
            echo "::error::The packaged Expo config names a cloud host"; exit 1
          fi
          # Nothing else in the bundle carries a canary either (plists, JSON).
          if grep -r -a -l -F "adglass-canary" "$app" | grep -q .; then
            echo "::error::A file in the app bundle contains a canary address:"; grep -r -a -l -F "adglass-canary" "$app"; exit 1
          fi

      - name: Package the built app for the boot job
        working-directory: mobile/ios/build-sim/Build/Products/Release-iphonesimulator
        run: |
          tar -czf "$RUNNER_TEMP/ad-glass-simulator-app.tgz" Mentra.app
          ls -lh "$RUNNER_TEMP/ad-glass-simulator-app.tgz"

      - name: Upload the built app
        uses: actions/upload-artifact@v4
        with:
          name: ad-glass-simulator-app
          path: ${{ runner.temp }}/ad-glass-simulator-app.tgz
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

      - name: Show the end of the build log on failure
        if: failure()
        run: |
          if [ -f "$BUILD_LOG" ]; then
            grep -n -E "error:|fatal error" "$BUILD_LOG" | head -100 || true
            tail -150 "$BUILD_LOG"
          fi

      - name: Upload the full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  boot:
    name: Boot with Mentra hosts blocked
    needs: simulator
    # Runs after a successful build, or on its own against an earlier run's build.
    if: ${{ always() && (needs.simulator.result == 'success' || inputs.app_run_id) }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          pick=""
          if [ -d /Applications/Xcode_26.2.app ]; then
            pick=/Applications/Xcode_26.2.app
          else
            pick="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)"
          fi
          if [ -n "$pick" ]; then sudo xcode-select -s "$pick/Contents/Developer"; fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Download the built app
        uses: actions/download-artifact@v4
        with:
          name: ad-glass-simulator-app
          path: ${{ runner.temp }}/app
          run-id: ${{ inputs.app_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Boot in a simulator with every Mentra hostname sinkholed
        run: |
          mkdir -p "$RUNNER_TEMP/app/unpacked" "$RUNNER_TEMP/evidence"
          tar -xzf "$RUNNER_TEMP/app/ad-glass-simulator-app.tgz" -C "$RUNNER_TEMP/app/unpacked"
          bash mobile/scripts/ad-glass-sim/boot.sh "$RUNNER_TEMP/app/unpacked/Mentra.app" "$RUNNER_TEMP/evidence"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/evidence/summary.md" ]; then
            cat "$RUNNER_TEMP/evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"
            for name in boot-all-text after-auth-link app-connections; do
              file="$RUNNER_TEMP/evidence/$name.txt"
              if [ -f "$file" ]; then echo "::group::$name"; cat "$file"; echo "::endgroup::"; fi
            done
            echo "::group::sinkhole log (connections the app made to blocked hosts)"
            cat "$RUNNER_TEMP/evidence/sinkhole.jsonl" || true
            echo "::endgroup::"
          fi

      - name: Upload the evidence (screenshots, text, sinkhole log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-glass-boot-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30
