# AD Glass: prove the iOS toolchain on GitHub's free hosted macOS runner.
#
# Builds the phone app for the iOS Simulator, unsigned. No Apple account, no
# secrets, no Mentra-owned runner. This is the phase 1 "can we build it at all"
# gate (docs/ad-glass/spec-phase1.md). The signed archive and TestFlight upload
# live in a separate workflow that is added once the Apple team exists.
#
# Deliberately independent of Mentra's own workflows: those need their
# self-hosted Mac, their match-certs repo and their Doppler / R2 secrets.
name: AD Glass iOS simulator build

on:
  push:
    branches:
      - "ad-glass/**"
    paths:
      - "mobile/**"
      - "cloud-v2/packages/cloud-client/**"
      - "cloud-v2/packages/protocol/**"
      - "cloud-v2/packages/workspace-contract/**"
      - "package.json"
      - "bun.lock"
      # mobile/scripts/build-number.mjs imports it.
      - ".github/scripts/release-family.mjs"
      - ".github/workflows/ad-glass-ios-simulator.yml"
  workflow_dispatch:

concurrency:
  group: ad-glass-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    name: Unsigned simulator build
    runs-on: macos-15
    timeout-minutes: 150
    env:
      # Mentra's Sentry build phase would try to upload symbols to their org.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      # Homebrew is not used; keep it from auto-updating if a tool calls it.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # Phase 1 still signs in to Mentra's cloud, so the app is pinned to the
      # environment their store app uses. The repository default is their dev
      # cloud. The guards below compare against these literals, never against
      # values read back from a file.
      CLOUD_CORE: https://core.us-west-2.mentraglass.com
      CLOUD_RUNTIME: https://runtime.us-west-2.mentraglass.com
      CLOUD_MINIAPPS: https://miniapps.mentraglass.com/
      CLOUD_DIRECTORY: https://api.apps.mentraglass.com/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          echo "BUILD_LOG=$RUNNER_TEMP/xcodebuild.log" >> "$GITHUB_ENV"
          ls -d /Applications/Xcode*.app
          # Mentra builds with Xcode 26.2. Prefer it, then the newest 26.x on
          # the image, then whatever the image defaults to.
          pick=""
          if [ -d /Applications/Xcode_26.2.app ]; then
            pick=/Applications/Xcode_26.2.app
          else
            pick="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)"
          fi
          if [ -n "$pick" ]; then sudo xcode-select -s "$pick/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i simulator || true
          df -h /

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tool versions
        run: |
          bun --version
          node --version
          ruby --version
          pod --version

      - name: Fork guards (config tests, ring fix, telemetry switches)
        run: |
          failed=0
          fail() { echo "::error::$1"; failed=1; }
          sdk=mobile/modules/bluetooth-sdk/ios/Source

          node --test mobile/scripts/ad-glass.test.mjs || fail "The AD Glass config tests failed"

          # The R1 ring fix must survive every upstream merge until upstream has
          # it (their PR 4981): connectByName has to re-create the controller.
          grep -B4 'controller?.connectById(name)' "$sdk/DeviceManager.swift" \
            | grep -q 'initController(pendingWearable)' \
            || fail "The R1 ring fix is missing from DeviceManager.connectByName"

          # The Bluetooth SDK's start-up call to Mentra (it carries a per-install
          # id that Mentra's Core forwards to their analytics) stays off whenever
          # the SDK's analytics are off.
          grep -q 'forInfoDictionaryKey: "MentraBluetoothSdkAnalyticsDisabled"' \
            "$sdk/internal/BluetoothSdkUpdateCheck.swift" \
            || fail "BluetoothSdkUpdateCheck no longer stops when the SDK's analytics are disabled"

          # One flag gates Mentra's Sentry and Firebase collection in the app.
          grep -q -E '^[[:space:]]*telemetry: false,[[:space:]]*$' mobile/src/services/deployment/officialManifest.ts \
            || fail "officialManifest.ts no longer sets telemetry: false"

          # app.config.ts must still pass its config through the AD Glass step.
          grep -q 'applyAdGlass(' mobile/app.config.ts \
            || fail "mobile/app.config.ts no longer calls applyAdGlass"

          exit "$failed"

      - name: Environment file
        working-directory: mobile
        run: |
          # .env.example carries only public placeholders (a dummy Mapbox token,
          # an empty Sentry DSN). Nothing secret is needed to compile.
          cp .env.example .env

          # The version the app's JavaScript reports. Without it the app opens
          # on an "App Version Missing" screen and never runs the cloud's
          # minimum-version check. Upstream sets it in a script CI does not run.
          version="$(node -p "require('../package.json').version")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '$version' is not a plain x.y.z version"; exit 1
          fi

          sed \
            -e "s|^EXPO_PUBLIC_BUILD_ENV=.*|EXPO_PUBLIC_BUILD_ENV=prod|" \
            -e "s|^EXPO_PUBLIC_CLOUD_CORE_URL=.*|EXPO_PUBLIC_CLOUD_CORE_URL=$CLOUD_CORE|" \
            -e "s|^EXPO_PUBLIC_CLOUD_RUNTIME_URL=.*|EXPO_PUBLIC_CLOUD_RUNTIME_URL=$CLOUD_RUNTIME|" \
            -e "s|^EXPO_PUBLIC_MINIAPPS_URL=.*|EXPO_PUBLIC_MINIAPPS_URL=$CLOUD_MINIAPPS|" \
            -e "s|^EXPO_PUBLIC_DIRECTORY_URL=.*|EXPO_PUBLIC_DIRECTORY_URL=$CLOUD_DIRECTORY|" \
            .env > .env.tmp
          mv .env.tmp .env
          {
            echo ""
            echo "EXPO_PUBLIC_MENTRAOS_VERSION=$version"
            echo "EXPO_PUBLIC_BUILD_COMMIT=${GITHUB_SHA:0:9}"
            echo "EXPO_PUBLIC_BUILD_BRANCH=$GITHUB_REF_NAME"
            echo "EXPO_PUBLIC_BUILD_USER=github-actions"
            echo "EXPO_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%d_%H-%M)"
          } >> .env

          # Each value must be set exactly once, to exactly what this job pins.
          # A renamed or duplicated line in upstream's .env.example fails here
          # instead of shipping an app that talks to the wrong cloud.
          failed=0
          want() { # name, value
            if [ "$(grep -c "^$1=" .env)" != 1 ] || ! grep -q -x -F "$1=$2" .env; then
              echo "::error::.env must set $1 exactly once, to '$2'"; failed=1
            fi
          }
          want EXPO_PUBLIC_BUILD_ENV prod
          want EXPO_PUBLIC_CLOUD_CORE_URL "$CLOUD_CORE"
          want EXPO_PUBLIC_CLOUD_RUNTIME_URL "$CLOUD_RUNTIME"
          want EXPO_PUBLIC_MINIAPPS_URL "$CLOUD_MINIAPPS"
          want EXPO_PUBLIC_DIRECTORY_URL "$CLOUD_DIRECTORY"
          want EXPO_PUBLIC_MENTRAOS_VERSION "$version"
          # No crash reporting to anyone: the DSN must stay empty.
          want EXPO_PUBLIC_SENTRY_DSN ""
          [ "$failed" = 0 ] || exit 1

          # Xcode script phases (the JS bundler) inherit this job's environment.
          grep -E '^EXPO_PUBLIC_[A-Z0-9_]+=' .env >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: |
          # mobile's preinstall script is run with zx before node_modules exists.
          bun add -g zx
          bun install --no-frozen-lockfile

      - name: Expo prebuild (generate the Xcode project)
        working-directory: mobile
        run: |
          rm -rf ios
          bun expo prebuild --platform ios

      - name: Verify the generated project
        working-directory: mobile/ios
        run: |
          # The same identity and telemetry checks as on the built app, made
          # here as well because this is minutes into the job, not an hour.
          failed=0
          fail() { echo "::error::$1"; failed=1; }
          info=Mentra/Info.plist
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$info" 2>/dev/null || echo "(missing)"; }
          expect() { # name, wanted
            actual="$(plist "$1")"
            echo "$1 = $actual"
            [ "$actual" = "$2" ] || fail "$1 is '$actual' in the generated Info.plist, expected '$2'"
          }
          expect CFBundleDisplayName "AD Glass"
          expect CFBundleName "AD Glass"
          expect MentraBluetoothSdkAnalyticsDisabled "true"
          expect FIREBASE_ANALYTICS_COLLECTION_ENABLED "false"
          grep -q -E 'PRODUCT_BUNDLE_IDENTIFIER = "?com\.domingueandco\.adglass"?;' Mentra.xcodeproj/project.pbxproj \
            || fail "The Xcode project does not use the bundle id com.domingueandco.adglass"

          # Every permission prompt names AD Glass. "Mentra Live" is a model of
          # glasses and may stay; $(PRODUCT_NAME) would be shown as "Mentra".
          prompts="$(plutil -p "$info" | grep 'UsageDescription" =>' || true)"
          echo "$prompts"
          [ -n "$prompts" ] || fail "No permission prompts found in the generated Info.plist"
          if echo "$prompts" | perl -ne '$bad = 1 if /Mentra(?! Live)/ || /\$\(PRODUCT_NAME\)/; END { exit($bad ? 0 : 1) }'; then
            fail "A permission prompt still names Mentra or the Xcode product"
          fi

          # No Firebase project file and no Sentry upload step in the project.
          if find . -path ./Pods -prune -o -name 'GoogleService-Info*.plist' -print | grep -q .; then
            fail "A Firebase GoogleService-Info plist is in the generated project"
          fi
          if grep -q -i -E 'sentry-xcode|sentry-cli' Mentra.xcodeproj/project.pbxproj || [ -f sentry.properties ]; then
            fail "The generated project still carries Sentry's build integration"
          fi
          exit "$failed"

      - name: Sherpa on-device speech framework
        working-directory: mobile
        run: |
          chmod +x scripts/setup-sherpa-onnx-optional.sh
          ./scripts/setup-sherpa-onnx-optional.sh

      - name: CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build for the iOS Simulator (unsigned)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Mentra.xcworkspace \
            -scheme Mentra \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$BUILD_LOG" \
            | grep --line-buffered -E "error:|fatal error|BUILD SUCCEEDED|BUILD FAILED|\*\* |^note: Run script|Resolved source packages|^CompileSwiftSources|^Ld .*Mentra\.app" || true
          # grep's exit status is not the build's: read the verdict from the log.
          grep -q "BUILD SUCCEEDED" "$BUILD_LOG"

      - name: Verify the built app
        working-directory: mobile/ios
        run: |
          app="build-sim/Build/Products/Release-iphonesimulator/Mentra.app"
          test -d "$app"
          du -sh "$app"
          # Every check runs, so one build reports every problem.
          failed=0
          fail() { echo "::error::$1"; failed=1; }
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Info.plist" 2>/dev/null || echo "(missing)"; }
          expect() { # name, wanted
            actual="$(plist "$1")"
            echo "$1 = $actual"
            [ "$actual" = "$2" ] || fail "$1 is '$actual', expected '$2'"
          }
          # Identity: ours, not Mentra's.
          expect CFBundleIdentifier "com.domingueandco.adglass"
          expect CFBundleDisplayName "AD Glass"
          expect CFBundleName "AD Glass"
          # The native version and the version the JavaScript reports agree.
          expect CFBundleShortVersionString "$EXPO_PUBLIC_MENTRAOS_VERSION"
          echo "build $(plist CFBundleVersion)"

          # Telemetry: the Bluetooth SDK's PostHog analytics are off, Firebase
          # collection is off, and no Firebase project file ships in the app.
          expect MentraBluetoothSdkAnalyticsDisabled "true"
          expect FIREBASE_ANALYTICS_COLLECTION_ENABLED "false"
          if find "$app" -name 'GoogleService-Info*.plist' | grep -q .; then
            fail "A Firebase GoogleService-Info plist is in the app bundle"
          fi

          # Every permission prompt names AD Glass ("Mentra Live" is a model of
          # glasses and may stay).
          prompts="$(plutil -p "$app/Info.plist" | grep 'UsageDescription" =>' || true)"
          echo "$prompts"
          [ -n "$prompts" ] || fail "No permission prompts found in the built Info.plist"
          if echo "$prompts" | perl -ne '$bad = 1 if /Mentra(?! Live)/ || /\$\(PRODUCT_NAME\)/; END { exit($bad ? 0 : 1) }'; then
            fail "A permission prompt still names Mentra"
          fi

          # Backend: the JavaScript bundle carries the endpoints this job pins.
          bundle="$app/main.jsbundle"
          if [ -f "$bundle" ]; then
            ls -lh "$bundle"
            for url in "$CLOUD_CORE" "$CLOUD_RUNTIME" "$CLOUD_MINIAPPS" "$CLOUD_DIRECTORY"; do
              [ -n "$url" ] || { fail "A pinned backend URL is empty"; continue; }
              grep -a -q -F "$url" "$bundle" || fail "main.jsbundle does not contain $url"
            done
            # No Sentry DSN (https://<32 hex>@<host>.sentry.io/<id>) in the bundle.
            if grep -a -q -E '[0-9a-f]{32}@[a-z0-9.-]*sentry\.io' "$bundle"; then
              fail "main.jsbundle contains a Sentry DSN"
            fi
          else
            fail "main.jsbundle is missing from the app"
          fi
          exit "$failed"

      - name: Show the end of the build log on failure
        if: failure()
        run: |
          if [ -f "$BUILD_LOG" ]; then
            grep -n -E "error:|fatal error" "$BUILD_LOG" | head -100 || true
            tail -150 "$BUILD_LOG"
          fi

      - name: Upload the full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
