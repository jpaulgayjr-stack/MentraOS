# Sightline: build the phone app on GitHub's free hosted runners and prove, as
# far as a machine without Bluetooth can, that it works with Mentra out of the
# picture (docs/sightline/spec-phase2.md).
#
#   tests      unit tests and the fork's static guards (Linux)
#   simulator  unsigned Release build for the iOS Simulator, with guards on the
#              built app (identity, telemetry, no backend, URL scheme)
#   boot       the built app booted in a simulator with every Mentra hostname
#              sinkholed: it must reach Home with no sign-in and contact none
#
# No Apple account, no secrets, no Mentra-owned runner. The signed archive and
# TestFlight upload live in a separate workflow that is added once the Apple
# team exists.
#
# Deliberately independent of Mentra's own workflows: those need their
# self-hosted Mac, their match-certs repo and their Doppler / R2 secrets.
name: Sightline iOS simulator build

on:
  push:
    branches:
      - "sightline/**"
    paths:
      - "mobile/**"
      - "cloud-v2/packages/cloud-client/**"
      - "cloud-v2/packages/protocol/**"
      - "cloud-v2/packages/workspace-contract/**"
      - "package.json"
      - "bun.lock"
      # mobile/scripts/build-number.mjs imports it.
      - ".github/scripts/release-family.mjs"
      - ".github/workflows/sightline-ios-simulator.yml"
  workflow_dispatch:
    inputs:
      app_run_id:
        description: "Boot the app built by this earlier run of the workflow instead of building again (run id)"
        required: false
        default: ""

concurrency:
  group: sightline-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  tests:
    name: Unit tests and static guards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fork guards (config, hostnames, scripts, engine)
        run: |
          node --test mobile/scripts/sightline.test.mjs mobile/scripts/sightline-hosts.test.mjs mobile/scripts/sightline-jest-gate.test.mjs
          python3 -m py_compile mobile/scripts/sightline-sim/sinkhole.py mobile/scripts/sightline-sim/pick-simulator.py mobile/scripts/sightline-sim/sinkhole-hosts.py
          bash -n mobile/scripts/sightline-sim/boot.sh
          # (The ring fix and the Bluetooth SDK's start-up call to Mentra are
          # guarded, and the latter tested by running it, in the macOS job.)
          # The engine builds no cloud client when Core and Runtime are null.
          grep -A6 '^function construct(): void {' mobile/modules/engine/src/services/CloudClientService.ts \
            | grep -q 'if (isCloudlessConfig(getConfigValues())) return' \
            || { echo "::error::CloudClientService.construct() no longer stops for a deployment with no servers"; exit 1; }

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: |
          # mobile's preinstall script is run with zx before node_modules exists.
          bun add -g zx
          bun install --no-frozen-lockfile

      - name: Type check
        working-directory: mobile
        run: bun run compile

      - name: Engine tests
        working-directory: mobile/modules/engine
        run: |
          # The engine's own runner: every test file in its own bun process.
          bash ./scripts/test.sh

      - name: App tests (jest)
        working-directory: mobile
        run: |
          # jest's own exit status is not the verdict: two upstream suites cannot
          # load here (they read Mentra firmware sources this repository does not
          # contain). The gate allows exactly those and nothing else.
          bun run test --json --outputFile="$RUNNER_TEMP/jest.json" || true
          node scripts/sightline-jest-gate.mjs "$RUNNER_TEMP/jest.json" "$PWD"

  simulator:
    name: Unsigned simulator build
    # Skipped when an earlier run's build is being booted again.
    if: ${{ !inputs.app_run_id }}
    runs-on: macos-15
    timeout-minutes: 150
    env:
      # Mentra's Sentry build phase would try to upload symbols to their org.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      # Homebrew is not used; keep it from auto-updating if a tool calls it.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # Sightline has no backend (phase 2). These are canaries, not servers: if
      # any code still read the build environment for a cloud address, the
      # canary would be compiled into the app, and "Verify the built app" fails
      # on finding one. The guards compare against these literals, never
      # against values read back from a file.
      CLOUD_CORE: https://sightline-canary-core.invalid
      CLOUD_RUNTIME: https://sightline-canary-runtime.invalid
      CLOUD_MINIAPPS: https://sightline-canary-miniapps.invalid/
      CLOUD_DIRECTORY: https://sightline-canary-directory.invalid/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          echo "BUILD_LOG=$RUNNER_TEMP/xcodebuild.log" >> "$GITHUB_ENV"
          ls -d /Applications/Xcode*.app
          # Mentra builds with Xcode 26.2. Prefer it, then the newest 26.x on
          # the image, then whatever the image defaults to.
          pick=""
          if [ -d /Applications/Xcode_26.2.app ]; then
            pick=/Applications/Xcode_26.2.app
          else
            pick="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)"
          fi
          if [ -n "$pick" ]; then sudo xcode-select -s "$pick/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i simulator || true
          df -h /

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tool versions
        run: |
          bun --version
          node --version
          ruby --version
          pod --version

      - name: Fork guards (config tests, ring fix, telemetry switches)
        run: |
          failed=0
          fail() { echo "::error::$1"; failed=1; }
          sdk=mobile/modules/bluetooth-sdk/ios/Source

          node --test mobile/scripts/sightline.test.mjs || fail "The Sightline config tests failed"

          # The R1 ring fix must survive every upstream merge until upstream has
          # it (their PR 4981): connectByName has to re-create the controller.
          grep -B4 'controller?.connectById(name)' "$sdk/DeviceManager.swift" \
            | grep -q 'initController(pendingWearable)' \
            || fail "The R1 ring fix is missing from DeviceManager.connectByName"

          # The Bluetooth SDK's start-up call to Mentra (it carries a per-install
          # id that Mentra's Core forwards to their analytics) stays off whenever
          # the SDK's analytics are off.
          # The next step tests the behaviour; this only says so in plain words
          # when a merge has dropped the line.
          grep -q -E '^[[:space:]]*if self\.bundle\.object\(forInfoDictionaryKey: "MentraBluetoothSdkAnalyticsDisabled"\) as\? Bool == true \{ return \}' \
            "$sdk/internal/BluetoothSdkUpdateCheck.swift" \
            || fail "BluetoothSdkUpdateCheck no longer stops when the SDK's analytics are disabled"

          # One flag gates Mentra's Sentry and Firebase collection in the app.
          grep -q -E '^[[:space:]]*telemetry: false,[[:space:]]*$' mobile/src/services/deployment/sightlineManifest.ts \
            || fail "sightlineManifest.ts no longer sets telemetry: false"

          # app.config.ts must still pass its config through the Sightline step.
          grep -q 'applySightline(' mobile/app.config.ts \
            || fail "mobile/app.config.ts no longer calls applySightline"

          exit "$failed"

      - name: Bluetooth SDK tests for the fork's change
        # Proves, by running it, that an app with the SDK's analytics disabled
        # sends no update check to Mentra, and that the test can tell.
        run: |
          set -o pipefail
          swift test --package-path mobile/modules/bluetooth-sdk --filter BluetoothSdkUpdateCheckTests 2>&1 \
            | tee "$RUNNER_TEMP/sdk-tests.log"
          # swift test also succeeds when the filter matches nothing, so name
          # the fork's two tests: both must have run and passed.
          for name in testAppThatDisablesSdkAnalyticsSendsNoUpdateCheck testAppThatKeepsSdkAnalyticsStillSendsTheUpdateCheck; do
            grep -q -F "$name]' passed" "$RUNNER_TEMP/sdk-tests.log" \
              || { echo "::error::The Bluetooth SDK test $name did not run and pass"; exit 1; }
          done

      - name: Environment file
        working-directory: mobile
        run: |
          # .env.example carries only public placeholders (a dummy Mapbox token,
          # an empty Sentry DSN). Nothing secret is needed to compile.
          cp .env.example .env

          # The version the app's JavaScript reports. Without it the app opens
          # on an "App Version Missing" screen and never runs the cloud's
          # minimum-version check. Upstream sets it in a script CI does not run.
          version="$(node -p "require('../package.json').version")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '$version' is not a plain x.y.z version"; exit 1
          fi

          for pinned in "$CLOUD_CORE" "$CLOUD_RUNTIME" "$CLOUD_MINIAPPS" "$CLOUD_DIRECTORY"; do
            if [ -z "$pinned" ]; then echo "::error::A pinned backend URL (CLOUD_*) is empty"; exit 1; fi
          done

          sed \
            -e "s|^EXPO_PUBLIC_BUILD_ENV=.*|EXPO_PUBLIC_BUILD_ENV=prod|" \
            -e "s|^EXPO_PUBLIC_CLOUD_CORE_URL=.*|EXPO_PUBLIC_CLOUD_CORE_URL=$CLOUD_CORE|" \
            -e "s|^EXPO_PUBLIC_CLOUD_RUNTIME_URL=.*|EXPO_PUBLIC_CLOUD_RUNTIME_URL=$CLOUD_RUNTIME|" \
            -e "s|^EXPO_PUBLIC_MINIAPPS_URL=.*|EXPO_PUBLIC_MINIAPPS_URL=$CLOUD_MINIAPPS|" \
            -e "s|^EXPO_PUBLIC_DIRECTORY_URL=.*|EXPO_PUBLIC_DIRECTORY_URL=$CLOUD_DIRECTORY|" \
            .env > .env.tmp
          mv .env.tmp .env
          {
            echo ""
            echo "EXPO_PUBLIC_MENTRAOS_VERSION=$version"
            echo "EXPO_PUBLIC_BUILD_COMMIT=${GITHUB_SHA:0:9}"
            echo "EXPO_PUBLIC_BUILD_BRANCH=$GITHUB_REF_NAME"
            echo "EXPO_PUBLIC_BUILD_USER=github-actions"
            echo "EXPO_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%d_%H-%M)"
          } >> .env

          # Each value must be set exactly once, to exactly what this job pins.
          # A renamed or duplicated line in upstream's .env.example fails here
          # instead of shipping an app that talks to the wrong cloud.
          failed=0
          want() { # name, value
            if [ "$(grep -c "^$1=" .env)" != 1 ] || ! grep -q -x -F "$1=$2" .env; then
              echo "::error::.env must set $1 exactly once, to '$2'"; failed=1
            fi
          }
          want EXPO_PUBLIC_BUILD_ENV prod
          want EXPO_PUBLIC_CLOUD_CORE_URL "$CLOUD_CORE"
          want EXPO_PUBLIC_CLOUD_RUNTIME_URL "$CLOUD_RUNTIME"
          want EXPO_PUBLIC_MINIAPPS_URL "$CLOUD_MINIAPPS"
          want EXPO_PUBLIC_DIRECTORY_URL "$CLOUD_DIRECTORY"
          want EXPO_PUBLIC_MENTRAOS_VERSION "$version"
          # No crash reporting to anyone: the DSN must stay empty.
          want EXPO_PUBLIC_SENTRY_DSN ""
          [ "$failed" = 0 ] || exit 1

          # Xcode script phases (the JS bundler) inherit this job's environment.
          grep -E '^EXPO_PUBLIC_[A-Z0-9_]+=' .env >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: |
          # mobile's preinstall script is run with zx before node_modules exists.
          bun add -g zx
          bun install --no-frozen-lockfile

      - name: Expo prebuild (generate the Xcode project)
        working-directory: mobile
        run: |
          rm -rf ios
          bun expo prebuild --platform ios

      - name: Verify the generated project
        working-directory: mobile/ios
        run: |
          # The same identity and telemetry checks as on the built app, made
          # here as well because this is minutes into the job, not an hour.
          failed=0
          fail() { echo "::error::$1"; failed=1; }
          info=Mentra/Info.plist
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$info" 2>/dev/null || echo "(missing)"; }
          expect() { # name, wanted
            actual="$(plist "$1")"
            echo "$1 = $actual"
            [ "$actual" = "$2" ] || fail "$1 is '$actual' in the generated Info.plist, expected '$2'"
          }
          expect_bool() { # name, wanted. The SDK reads a real boolean; the string "true" would not count.
            actual="$(plutil -extract "$1" raw -expect bool -o - "$info" 2>/dev/null || echo "(missing or not a boolean)")"
            echo "$1 = $actual"
            [ "$actual" = "$2" ] || fail "$1 is '$actual' in the generated Info.plist, expected the boolean $2"
          }
          expect CFBundleDisplayName "Sightline"
          expect CFBundleName "Sightline"
          expect_bool MentraBluetoothSdkAnalyticsDisabled true
          expect_bool FIREBASE_ANALYTICS_COLLECTION_ENABLED false
          grep -q -E 'PRODUCT_BUNDLE_IDENTIFIER = "?com\.domingueandco\.sightline"?;' Mentra.xcodeproj/project.pbxproj \
            || fail "The Xcode project does not use the bundle id com.jpaulgay.sightline"

          # Every permission prompt names Sightline. "Mentra Live" is a model of
          # glasses and may stay; $(PRODUCT_NAME) and the like would be shown as
          # "Mentra". perl exits 0 only when it ran and found nothing.
          prompts="$(plutil -p "$info" | grep 'UsageDescription" =>' || true)"
          echo "$prompts"
          [ -n "$prompts" ] || fail "No permission prompts found in the generated Info.plist"
          if ! echo "$prompts" | perl -ne '$bad = 1 if /Mentra(?! Live)/ || /\$[({](PRODUCT_NAME|TARGET_NAME|EXECUTABLE_NAME)[)}]/; END { exit($bad ? 1 : 0) }'; then
            fail "A permission prompt still names Mentra or the Xcode product"
          fi

          # No Firebase project file and no Sentry upload step in the project.
          if find . -path ./Pods -prune -o -name 'GoogleService-Info*.plist' -print | grep -q .; then
            fail "A Firebase GoogleService-Info plist is in the generated project"
          fi
          if grep -q -i -E 'sentry-xcode|sentry-cli' Mentra.xcodeproj/project.pbxproj || [ -f sentry.properties ]; then
            fail "The generated project still carries Sentry's build integration"
          fi
          exit "$failed"

      - name: Sherpa on-device speech framework
        working-directory: mobile
        run: |
          chmod +x scripts/setup-sherpa-onnx-optional.sh
          ./scripts/setup-sherpa-onnx-optional.sh

      # No pod cache, on purpose (docs/sightline/spec-phase1.md, section 8): a
      # restored Pods folder is state the source no longer describes.
      - name: CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build for the iOS Simulator (unsigned)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Mentra.xcworkspace \
            -scheme Mentra \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$BUILD_LOG" \
            | grep --line-buffered -E "error:|fatal error|BUILD SUCCEEDED|BUILD FAILED|\*\* |^note: Run script|Resolved source packages|^CompileSwiftSources|^Ld .*Mentra\.app" || true
          # grep's exit status is not the build's: read the verdict from the log.
          grep -q "BUILD SUCCEEDED" "$BUILD_LOG"

      - name: Verify the built app
        working-directory: mobile/ios
        run: |
          app="build-sim/Build/Products/Release-iphonesimulator/Mentra.app"
          test -d "$app"
          du -sh "$app"
          # Every check runs, so one build reports every problem.
          failed=0
          fail() { echo "::error::$1"; failed=1; }
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Info.plist" 2>/dev/null || echo "(missing)"; }
          expect() { # name, wanted
            actual="$(plist "$1")"
            echo "$1 = $actual"
            [ "$actual" = "$2" ] || fail "$1 is '$actual', expected '$2'"
          }
          expect_bool() { # name, wanted. The SDK reads a real boolean; the string "true" would not count.
            actual="$(plutil -extract "$1" raw -expect bool -o - "$app/Info.plist" 2>/dev/null || echo "(missing or not a boolean)")"
            echo "$1 = $actual"
            [ "$actual" = "$2" ] || fail "$1 is '$actual', expected the boolean $2"
          }
          # Identity: ours, not Mentra's.
          expect CFBundleIdentifier "com.jpaulgay.sightline"
          expect CFBundleDisplayName "Sightline"
          expect CFBundleName "Sightline"
          # The native version and the version the JavaScript reports agree.
          expect CFBundleShortVersionString "$EXPO_PUBLIC_MENTRAOS_VERSION"
          echo "build $(plist CFBundleVersion)"

          # Telemetry: the Bluetooth SDK's PostHog analytics are off, Firebase
          # collection is off, and no Firebase project file ships in the app.
          expect_bool MentraBluetoothSdkAnalyticsDisabled true
          expect_bool FIREBASE_ANALYTICS_COLLECTION_ENABLED false
          if find "$app" -name 'GoogleService-Info*.plist' | grep -q .; then
            fail "A Firebase GoogleService-Info plist is in the app bundle"
          fi

          # Every permission prompt names Sightline ("Mentra Live" is a model of
          # glasses and may stay).
          prompts="$(plutil -p "$app/Info.plist" | grep 'UsageDescription" =>' || true)"
          echo "$prompts"
          [ -n "$prompts" ] || fail "No permission prompts found in the built Info.plist"
          if ! echo "$prompts" | perl -ne '$bad = 1 if /Mentra(?! Live)/ || /\$[({](PRODUCT_NAME|TARGET_NAME|EXECUTABLE_NAME)[)}]/; END { exit($bad ? 1 : 0) }'; then
            fail "A permission prompt still names Mentra"
          fi

          # URL scheme: sightline, and nothing of Mentra's.
          schemes="$(plutil -extract CFBundleURLTypes json -o - "$app/Info.plist" 2>/dev/null \
            | python3 -c 'import json,sys; print(" ".join(s for t in json.load(sys.stdin) for s in t.get("CFBundleURLSchemes", [])))' || true)"
          echo "URL schemes: $schemes"
          echo " $schemes " | grep -q " sightline " || fail "The sightline URL scheme is not registered"
          if echo " $schemes " | grep -q -E " com\.mentra(\.[a-z.]+)? "; then
            fail "A Mentra URL scheme is still registered: $schemes"
          fi

          # Backend: none. The embedded deployment is the local one, and no cloud
          # address from the build environment (the canaries this job pins) is
          # in the JavaScript bundle, the packaged Expo config, or any other file
          # in the app.
          bundle="$app/main.jsbundle"
          if [ -f "$bundle" ]; then
            ls -lh "$bundle"
            grep -a -q -F "sightline-local" "$bundle" \
              || fail "main.jsbundle does not contain the sightline-local deployment"
            for canary in "$CLOUD_CORE" "$CLOUD_RUNTIME" "$CLOUD_MINIAPPS" "$CLOUD_DIRECTORY" "sightline-canary"; do
              [ -n "$canary" ] || { fail "A canary address (CLOUD_*) is empty"; continue; }
              if grep -a -q -F "$canary" "$bundle"; then
                fail "main.jsbundle contains $canary: something still reads a cloud address from the build environment"
              fi
            done
            # No Sentry DSN (https://<32 hex>@<host>.sentry.io/<id>) in the bundle.
            # The one key excluded is the sample DSN in a source comment of
            # Sentry's own SDK (diagnose-sdk.js). Hermes drops comments today;
            # the exclusion keeps the guard honest if the bundle ever stops
            # being bytecode.
            if grep -a -o -E '[0-9a-f]{32}@[a-z0-9.-]*sentry\.io' "$bundle" | grep -v '^c1dfb07d783ad5325c245c1fd3725390@' | grep -q .; then
              fail "main.jsbundle contains a Sentry DSN"
            fi
          else
            fail "main.jsbundle is missing from the app"
          fi
          config="$(find "$app" -name app.config | head -1)"
          if [ -z "$config" ] || [ ! -f "$config" ]; then
            fail "The packaged Expo config (app.config) was not found in the app"
          elif grep -a -q -i -E "mentraglass\.(com|cn)|mentra\.glass" "$config"; then
            fail "The packaged Expo config names a Mentra host"
          fi
          carriers="$(grep -r -a -l -F "sightline-canary" "$app" || true)"
          if [ -n "$carriers" ]; then
            fail "A file in the app bundle contains a canary address: $(echo "$carriers" | tr '\n' ' ')"
          fi
          exit "$failed"

      - name: Package the built app for the boot job
        working-directory: mobile/ios/build-sim/Build/Products/Release-iphonesimulator
        run: |
          tar -czf "$RUNNER_TEMP/sightline-simulator-app.tgz" Mentra.app
          ls -lh "$RUNNER_TEMP/sightline-simulator-app.tgz"

      - name: Upload the built app
        uses: actions/upload-artifact@v4
        with:
          name: sightline-simulator-app
          path: ${{ runner.temp }}/sightline-simulator-app.tgz
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

      - name: Show the end of the build log on failure
        if: failure()
        run: |
          if [ -f "$BUILD_LOG" ]; then
            grep -n -E "error:|fatal error" "$BUILD_LOG" | head -100 || true
            tail -150 "$BUILD_LOG"
          fi

      - name: Upload the full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  boot:
    name: Boot with Mentra hosts blocked
    needs: simulator
    # Runs after a successful build, or on its own against an earlier run's build.
    if: ${{ always() && (needs.simulator.result == 'success' || inputs.app_run_id) }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          pick=""
          if [ -d /Applications/Xcode_26.2.app ]; then
            pick=/Applications/Xcode_26.2.app
          else
            pick="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)"
          fi
          if [ -n "$pick" ]; then sudo xcode-select -s "$pick/Contents/Developer"; fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Download the built app
        uses: actions/download-artifact@v4
        with:
          name: sightline-simulator-app
          path: ${{ runner.temp }}/app
          run-id: ${{ inputs.app_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Boot in a simulator with every Mentra hostname sinkholed
        run: |
          mkdir -p "$RUNNER_TEMP/app/unpacked" "$RUNNER_TEMP/evidence"
          tar -xzf "$RUNNER_TEMP/app/sightline-simulator-app.tgz" -C "$RUNNER_TEMP/app/unpacked"
          bash mobile/scripts/sightline-sim/boot.sh "$RUNNER_TEMP/app/unpacked/Mentra.app" "$RUNNER_TEMP/evidence"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/evidence/summary.md" ]; then
            cat "$RUNNER_TEMP/evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"
            for name in boot-all-text link-1-prompt link-1 link-2 app-connections; do
              file="$RUNNER_TEMP/evidence/$name.txt"
              if [ -f "$file" ]; then echo "::group::$name"; cat "$file"; echo "::endgroup::"; fi
            done
            echo "::group::sinkhole log while the app ran (empty means no connection to a blocked host)"
            if [ -f "$RUNNER_TEMP/evidence/sinkhole-during-app.jsonl" ]; then
              cat "$RUNNER_TEMP/evidence/sinkhole-during-app.jsonl"
            else
              echo "(not written: the boot script stopped before the app had run)"
            fi
            echo "::endgroup::"
          fi

      - name: Upload the evidence (screenshots, text, sinkhole log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sightline-boot-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30
